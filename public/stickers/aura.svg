<svg xmlns="http://www.w3.org/2000/svg" width="240" height="190" viewBox="0 0 240 190" role="img" aria-label="AURA sticker">
 <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#72f2dc"/><stop offset="1" stop-color="#617cff"/></linearGradient><filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#14213b" flood-opacity=".22"/></filter></defs>
 <style>.bob{transform-origin:120px 100px;animation:bob 2.2s ease-in-out infinite}.spark{transform-origin:center;animation:blink 1.4s ease-in-out infinite alternate}@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-7px) rotate(1deg)}}@keyframes blink{from{opacity:.3;transform:scale(.7)}to{opacity:1;transform:scale(1.2)}}</style>
 <rect x="5" y="5" width="230" height="180" rx="25" fill="url(#bg)" stroke="#ffffff" stroke-opacity=".65" stroke-width="3"/>
 <circle class="spark" cx="28" cy="31" r="5" fill="#fff"/><path class="spark" d="M202 25 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4Z" fill="#fff"/>
 <g filter="url(#shadow)"><g class="bob"><circle cx="120" cy="94" r="64" fill="none" stroke="#f5ffff" stroke-width="7" stroke-dasharray="12 8"/><circle cx="120" cy="94" r="46" fill="#b5fff0" fill-opacity=".35" stroke="#fff" stroke-width="3"/><path d="M120 36 L135 78 L179 80 L145 108 L156 151 L120 126 L84 151 L95 108 L61 80 L105 78Z" fill="#fff5a6" stroke="#3a4b9b" stroke-width="5"/><circle cx="120" cy="94" r="10" fill="#fff"/></g></g>
 <rect x="13" y="157" width="214" height="20" rx="10" fill="#16223b" fill-opacity=".82"/>
 <text x="120" y="171" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="900" letter-spacing="1.4" fill="#fff">+1000 AURA POINTS</text>
 </svg>